# inventory join bundle, rendered by the gateway's add-module wizard.
#   docker compose up -d
# Values come from .env (written by the gateway: core addresses, generated
# passwords and keys, and the host inputs you gave). private/ holds the
# single-use enrolment token, the mesh CA and this bundle's own TLS material
# (local CA, server certificates for the database and the ingest edge). The
# event bus is the core's Valkey (VALKEY_ADDRESS, TLS, CA from VALKEY_CA_FILE).
name: tangra-inventory
services:
  inventory-db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_PASSWORD: ${GEN_PASSWORD_1}
      INVENTORY_APP_PASSWORD: ${GEN_PASSWORD_2}
    # The server key must belong to the postgres user: copy it before start.
    entrypoint: ["sh", "-c", "install -d -o postgres -m 0700 /tls-pg && install -o postgres -m 0600 /tls/inventory-db.key /tls-pg/server.key && install -o postgres -m 0644 /tls/inventory-db.crt /tls-pg/server.crt && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls-pg/server.crt", "-c", "ssl_key_file=/tls-pg/server.key"]
    volumes:
      - inventory-db:/var/lib/postgresql/data
      - ./private/tls:/tls:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      retries: 30
  # One-shot: hands the ingest key pair and the state directory to the
  # image's unprivileged user (uid 10001). Runs again on every `up`, so a
  # replaced private/tls/inventory-ingest.{crt,key} reaches the service.
  inventory-init:
    image: ${MODULE_IMAGE}:${MODULE_VERSION}
    user: "0:0"
    entrypoint: ["sh", "-c", "install -o 10001 -m 0644 /src/inventory-ingest.crt /ingest-tls/tls.crt && install -o 10001 -m 0600 /src/inventory-ingest.key /ingest-tls/tls.key && chown 10001 /state && chmod 0700 /state"]
    volumes:
      - ./private/tls:/src:ro
      - inventory-ingest-tls:/ingest-tls
      - inventory-state:/state
  inventory:
    image: ${MODULE_IMAGE}:${MODULE_VERSION}
    restart: unless-stopped
    command: ["-config", "/app/config.yaml"]
    environment:
      INVENTORY_KEK: ${GEN_KEY_1}
      FREYA_ADVERTISE_HOST: ${MODULE_ADVERTISE_HOST}
    ports:
      - "${MODULE_BIND_IP}:9975:9975"
      - "${MODULE_BIND_IP}:9976:9976"
      - "${INGEST_PUBLIC_PORT}:9977"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./policy.yaml:/app/policy.yaml:ro
      - ./private/enrollment.token:/tokens/enrollment.token:ro
      - ./private/tls/ca.pem:/tls/ca.pem:ro
      - ${VALKEY_CA_FILE}:/tls/valkey-ca.pem:ro
      - inventory-ingest-tls:/ingest-tls:ro
      - inventory-state:/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9810/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      inventory-db: { condition: service_healthy }
      inventory-init: { condition: service_completed_successfully }
volumes:
  inventory-db: {}
  inventory-ingest-tls: {}
  inventory-state: {}
