# go-tangra inventory agent. Set ingest_endpoint and either place an
# enrollment token (minted in the console: Inventory > Agents) in the
# token_file, or configure auto_enroll below with a tenant enrollment key
# (Inventory > Agents > Automatic enrollment), then:
#   systemctl start inventory-agent
# The token (or key) is used on first contact; the agent then keeps its
# credential in credential_file. Options: see deploy/README.md in
# go-tangra-inventory.

ingest_endpoint: ""                # host:port of the inventory ingest edge, e.g. portal.example.org:9977
token_file: /etc/inventory-agent/enrollment.token
credential_file: /var/lib/inventory-agent/credential
state_file: /var/lib/inventory-agent/state.json
# Automatic enrollment without a token (used when token_file does not exist):
# auto_enroll:
#   key_id: ak_...                                   # public key id shown in the console
#   key_file: /etc/inventory-agent/auto-enroll.key   # the key secret aks_... (mode 0600)
interval_seconds: 3600             # 60-604800
# ca_file: /etc/inventory-agent/ca.pem   # pin the CA that signs the ingest certificate (default: system roots)
# server_name: ""                        # name to verify in the ingest certificate (default: endpoint host)

collect_bmc: true                  # read-only BMC LAN parameters (needs ipmi_devintf + ipmi_si)
collect_updates: true              # package update state
refresh_package_lists: false       # never refresh package lists unless enabled
update_timeout_seconds: 120        # 30-600
collect_disks: true                # physical disks: model, serial, size, SSD/HDD/NVMe, interface (sysfs)

# Self-upgrade (needs systemd): upgrades come only from the ingest endpoint
# above, are verified with the release key built into the agent and roll
# back automatically when the new version does not report in time.
upgrade:
  enabled: true                    # act on upgrade requests from the platform (false: only `inventory-agent update`)
  confirm_timeout_seconds: 300     # 60-1800
  # staging_dir: /var/lib/inventory-agent/upgrade

# Certificates delivered by the platform (deployer provider "Inventory
# agent", Linux only). Files go only to `directory` in the certbot layout
# (live/<name>/{cert,chain,fullchain,privkey}.pem, a symlink switched
# atomically to archive/<name>/<generation>/, metadata in
# renewal/<name>.json); the platform chooses only <name>. Directories are
# root:<group>, files <owner>:<group>. Nothing is executed unless
# deploy_hook is set here: the hook must be a root-owned file, not writable
# by group or others, in a root-owned directory not writable by group or
# others. It is run directly (no shell, no arguments) after a new or renewed
# certificate, with only PATH, LANG and the LCM_* variables (LCM_CERT_NAME,
# LCM_CERT_DIR, LCM_CERT_PATH, LCM_KEY_PATH, LCM_CHAIN_PATH,
# LCM_FULLCHAIN_PATH, LCM_COMMON_NAME, LCM_DNS_NAMES, LCM_IP_ADDRESSES,
# LCM_SERIAL_NUMBER, LCM_EXPIRES_AT, LCM_IS_RENEWAL, LCM_CERTIFICATE_ID);
# its output stays in the agent log. The agent unit has ProtectHome and
# PrivateTmp: a hook cannot use /home or the host's /tmp, `systemctl reload
# nginx` works. /etc/inventory-agent is 0750 root:root, so a non-root
# service that reads its files itself needs a directory outside it.
# certificates:
#   enabled: true                      # false: refuse deliveries ("disabled locally")
#   directory: /etc/inventory-agent/certs
#   owner: root                        # user owning the files (name or uid)
#   group: root                        # group of files and directories, e.g. www-data with key_mode 0640
#   dir_mode: "0750"                   # 0700-0755
#   cert_mode: "0644"
#   key_mode: "0600"                   # 0600 or 0640
#   keep_previous: 1                   # previous generations kept for a manual restore (0-5)
#   deploy_hook: ""                    # e.g. /usr/local/sbin/reload-nginx.sh
#   hook_timeout_seconds: 300          # 30-1800; the hook's process group is killed after it
#   allow_insecure_transport: false    # development only: accept certificates over a plaintext ingest connection
