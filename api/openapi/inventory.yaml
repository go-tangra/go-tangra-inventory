openapi: 3.1.0
info:
  title: Inventory API
  version: 0.1.0
  description: >
    Endpoint inventory: managed hosts, their immutable inventory snapshots
    (hardware, OS, software and network), detected change history, per-tenant
    statistics, operator agent enrollment and control, and tenant backup.
    Gateway-proxied under /api/inventory. Every route declares an
    x-freya-permission; agent and enrollment credentials and sealed fields are
    never returned in listings or logs.
servers:
  - url: /
components:
  parameters:
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-000000000001'
    hostId:
      name: host_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-0000000000aa'
    other:
      name: other
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-000000000002'
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 64 }
    limit:
      name: limit
      in: query
      required: false
      description: 'legacy (kept one release): use page / page_size; mixing both styles is validation_failed (param cursor)'
      schema: { type: integer, minimum: 1, maximum: 500 }
    # List contract (go-tangra specs/032-server-side-tables, contracts/http-list.md).
    page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 2147483647 }
    pageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200 }
    order:
      name: order
      in: query
      required: false
      description: 'sort direction; defaults to the chosen field''s default direction'
      schema: { type: string, enum: [asc, desc] }
    upgradeState:
      name: state
      in: query
      required: false
      schema: { type: string, enum: [up_to_date, available, pending, in_progress, failed, rolled_back, manual_upgrade_required, unsupported] }
    requestState:
      name: state
      in: query
      required: false
      schema: { type: string, enum: [pending, delivered, downloading, installing, succeeded, failed, rolled_back, expired, cancelled] }
    outdated:
      name: outdated
      in: query
      required: false
      schema: { type: boolean }
    itemId:
      name: item_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-0000000000c1'
    agentIdQuery:
      name: agent_id
      in: query
      required: false
      schema: { type: string, maxLength: 64 }
  schemas:
    Error:
      type: object
      properties:
        reason: { type: string }
        detail: { type: object }
      example:
        reason: not_found
        detail: {}
    # --- Agent self-upgrade (feature 023) ---
    AgentFleetEntry:
      type: object
      description: One enrolled agent (online or not) with its upgrade state. The keys of the former connected-agents listing are kept.
      properties:
        enrolled_via: { type: string, enum: [token, auto], description: 'enrollment method (feature 029)' }
        auto_enroll_key_id: { type: string, description: 'public id of the auto-enrollment key, when enrolled_via = auto' }
        agent_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        host_id: { type: string }
        hostname: { type: string }
        version: { type: string }
        os: { type: string, enum: ['', linux, windows] }
        arch: { type: string, enum: ['', amd64, arm64] }
        install_type: { type: string, enum: ['', deb, rpm, binary] }
        online: { type: boolean }
        connected_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        target_version: { type: string }
        upgrade_state: { type: string, enum: [up_to_date, available, pending, in_progress, failed, rolled_back, manual_upgrade_required, unsupported] }
        upgrade_reason: { type: string, description: 'reason code only' }
        upgrade_id: { type: string, format: uuid }
        state_changed_at: { type: string, format: date-time }
        certificate_capability:
          type: string
          enum: [enabled, disabled_on_host, upgrade_required, not_supported_platform, disabled_on_server]
          description: 'whether the agent can receive certificates (feature 033, first match: server switch, platform, cert.v1 announced, version >= 4.7.0)'
    AgentFleet:
      type: object
      description: 'a list contract page (legacy cursor/limit requests: items, current_version and total only)'
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AgentFleetEntry' } }
        current_version: { type: string, description: 'the tenant target: policy pin or platform current agent version' }
        total: { type: integer }
        page: { type: integer, description: 'the page returned (a page beyond the end answers the last page)' }
        page_size: { type: integer }
        sort: { type: string, enum: [hostname, version, state, last_seen] }
        order: { type: string, enum: [asc, desc] }
    Host:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        hostname: { type: string }
        machine_id: { type: string }
        hardware_uuid: { type: string }
        system_serial: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        os_name: { type: string }
        os_version: { type: string }
        os_arch: { type: string }
        agent_version: { type: string }
        assigned_user: { type: string }
        status: { type: string, enum: [active, stale, retired] }
        tags: { type: object, additionalProperties: { type: string } }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        last_snapshot_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HostPage:
      type: object
      description: 'a list contract page (legacy cursor/limit requests: items and total only)'
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Host' } }
        total: { type: integer }
        page: { type: integer, description: 'the page returned (a page beyond the end answers the last page)' }
        page_size: { type: integer }
        sort: { type: string, enum: [hostname, os_name, manufacturer, status, last_seen, created_at] }
        order: { type: string, enum: [asc, desc] }
    SnapshotSummary:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string, format: uuid }
        host_id: { type: string }
        collected_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        agent_version: { type: string }
        source: { type: string }
        os_name: { type: string }
        os_version: { type: string }
        manufacturer: { type: string }
        model: { type: string }
    SnapshotPage:
      type: object
      description: 'a list contract page of payload-free summaries (legacy cursor/limit requests: items and total only)'
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SnapshotSummary' } }
        total: { type: integer }
        page: { type: integer, description: 'the page returned (a page beyond the end answers the last page)' }
        page_size: { type: integer }
        sort: { type: string, enum: [collected_at] }
        order: { type: string, enum: [asc, desc] }
    Change:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string, format: uuid }
        host_id: { type: string }
        snapshot_id: { type: string }
        prev_snapshot_id: { type: string }
        detected_at: { type: string, format: date-time }
        category: { type: string }
        change_type: { type: string, enum: [added, removed, modified] }
        component_key: { type: string }
        before: { type: string, description: JSON }
        after: { type: string, description: JSON }
    ChangePage:
      type: object
      description: 'a list contract page (legacy limit requests: items and total only)'
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Change' } }
        total: { type: integer }
        page: { type: integer, description: 'the page returned (a page beyond the end answers the last page)' }
        page_size: { type: integer }
        sort: { type: string, enum: [detected_at, kind], description: 'kind is the change type' }
        order: { type: string, enum: [asc, desc] }
    AgentUpgrade:
      type: object
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        host_id: { type: string }
        from_version: { type: string }
        target_version: { type: string }
        allow_downgrade: { type: boolean }
        state: { type: string, enum: [pending, delivered, downloading, installing, succeeded, failed, rolled_back, expired, cancelled] }
        origin: { type: string, enum: [user, policy, agent] }
        requested_by: { type: string }
        reason: { type: string }
        attempts: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    AgentDetail:
      allOf:
        - $ref: '#/components/schemas/AgentFleetEntry'
        - type: object
          properties:
            recent_upgrades: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/AgentUpgrade' } }
    UpgradeRequest:
      type: object
      additionalProperties: false
      properties:
        agent_ids: { type: array, maxItems: 1000, uniqueItems: true, items: { type: string, maxLength: 64 } }
        all_outdated: { type: boolean, description: 'every outdated, upgrade-capable agent of the tenant' }
      oneOf:
        - required: [agent_ids]
        - required: [all_outdated]
    UpgradeBatchResult:
      type: object
      properties:
        target_version: { type: string }
        created: { type: array, items: { $ref: '#/components/schemas/AgentUpgrade' } }
        skipped:
          type: array
          items:
            type: object
            properties:
              agent_id: { type: string }
              reason: { type: string, enum: [up_to_date, upgrade_active, manual_upgrade_required, unsupported, no_release_for_platform, not_found] }
    AgentUpgradeList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AgentUpgrade' } }
        next_cursor: { type: string }
    UpgradePolicy:
      type: object
      additionalProperties: false
      required: [enabled, window_start, window_end, timezone, max_concurrent, target_version]
      properties:
        enabled: { type: boolean }
        window_start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        window_end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'may wrap past midnight; equal to window_start = the whole day' }
        timezone: { type: string, maxLength: 64, description: 'IANA name, validated with time.LoadLocation' }
        max_concurrent: { type: integer, minimum: 1, maximum: 100 }
        target_version: { type: string, maxLength: 64, description: '"" = platform current; otherwise a stored release version (a lower pin downgrades newer agents)' }
        paused: { type: boolean, readOnly: true }
        paused_reason: { type: string, readOnly: true }
        updated_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    AutoEnrollSwitch:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    AutoEnroll:
      type: object
      properties:
        enabled: { type: boolean }
        updated_by: { type: string }
        updated_at: { type: [string, 'null'], format: date-time }
        window_seconds: { type: integer, description: 'accepted clock skew of a proof timestamp' }
        keys: { type: array, items: { $ref: '#/components/schemas/AutoEnrollKey' }, description: 'one list contract page of the keys' }
        total: { type: integer, description: 'number of keys' }
        page: { type: integer, description: 'the page of keys returned (a page beyond the end answers the last page)' }
        page_size: { type: integer }
        sort: { type: string, enum: [name, created_at] }
        order: { type: string, enum: [asc, desc] }
    AutoEnrollKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        key_id: { type: string, pattern: '^ak_[0-9a-f]{24}$', description: 'public id agents send' }
        name: { type: string }
        allowed_cidrs: { type: array, items: { type: string } }
        enabled: { type: boolean }
        state: { type: string, enum: [active, disabled, expired, exhausted] }
        expires_at: { type: [string, 'null'], format: date-time }
        max_enrollments: { type: integer, description: '0 = unlimited' }
        enrollments: { type: integer }
        last_used_at: { type: [string, 'null'], format: date-time }
        last_used_ip: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AutoEnrollKeySecret:
      type: object
      properties:
        key: { $ref: '#/components/schemas/AutoEnrollKey' }
        secret: { type: string, description: 'aks_…; shown once, never stored in clear' }
    AutoEnrollKeyCreate:
      type: object
      additionalProperties: false
      required: [name, allowed_cidrs]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        allowed_cidrs: { type: array, minItems: 1, maxItems: 32, items: { type: string, maxLength: 64 }, description: 'networks agents may enroll from (a bare address is a single host; /0 is refused)' }
        enabled: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time }
        max_enrollments: { type: integer, minimum: 0, maximum: 1000000 }
    AutoEnrollKeyUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        allowed_cidrs: { type: array, minItems: 1, maxItems: 32, items: { type: string, maxLength: 64 } }
        enabled: { type: boolean }
        expires_at: { type: [string, 'null'], format: date-time, description: 'null removes the expiry' }
        max_enrollments: { type: integer, minimum: 0, maximum: 1000000 }
    AgentReleaseInfo:
      type: object
      properties:
        version: { type: string }
        source: { type: string, enum: [bundled, import] }
        key_id: { type: string }
        imported_at: { type: string, format: date-time }
        platforms:
          type: array
          items:
            type: object
            properties:
              os: { type: string }
              arch: { type: string }
              install_type: { type: string }
              size: { type: integer }
    # --- Certificate delivery (feature 033, US4): identity only, never material ---
    CertificateDeliveryItem:
      type: object
      additionalProperties: false
      description: 'one delivery of a certificate to one host'
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        hostname: { type: string }
        name: { type: string, description: 'certificate name on the host (directory under the agent certificate store)' }
        certificate_id: { type: string, description: 'lcm certificate id' }
        configuration_id: { type: string, description: 'deployer configuration that requested the delivery' }
        trigger: { type: string, enum: [manual, auto_deploy, retry] }
        state: { type: string, enum: [pending, delivered, fetched, installed, unchanged, failed, hook_failed, unsupported, superseded, expired, cancelled] }
        reason: { type: string, description: 'reason code only' }
        attempts: { type: integer }
        serial: { type: string }
        fingerprint_sha256: { type: string }
        common_name: { type: string, description: 'subject CN of the leaf served at fetch' }
        not_after: { type: [string, 'null'], format: date-time }
        hook_exit_code: { type: [integer, 'null'], description: '-1 hook not run, 256 timeout' }
        detail: { type: string, description: 'sanitised agent detail (<= 256 bytes, never hook output)' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    CertificateDeliveryItemPage:
      type: object
      additionalProperties: false
      description: 'a list contract page of delivery items (newest first by default)'
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CertificateDeliveryItem' } }
        total: { type: integer }
        page: { type: integer, description: 'the page returned (a page beyond the end answers the last page)' }
        page_size: { type: integer }
        sort: { type: string, enum: [created_at, updated_at, state, name] }
        order: { type: string, enum: [asc, desc] }
    CertificateDelivery:
      type: object
      additionalProperties: false
      description: 'the delivery request an item belongs to'
      properties:
        id: { type: string, format: uuid }
        source: { type: string, description: 'mesh service that requested it, e.g. deployer' }
        configuration_id: { type: string }
        target_id: { type: string }
        trigger: { type: string, enum: [manual, auto_deploy, retry] }
        certificate_id: { type: string }
        name: { type: string }
        key_policy: { type: string, enum: [require, certificate_only] }
        requested_by: { type: string, description: 'SPIFFE id of the caller' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    CertificateDeliveryItemDetail:
      type: object
      additionalProperties: false
      properties:
        item: { $ref: '#/components/schemas/CertificateDeliveryItem' }
        delivery: { $ref: '#/components/schemas/CertificateDelivery' }
    HostCertificate:
      type: object
      additionalProperties: false
      description: 'the current certificate of a host under one name; a name with only a queued delivery has that item''s state (pending, delivered, fetched) and no installed identity'
      properties:
        name: { type: string }
        certificate_id: { type: string }
        configuration_id: { type: string }
        common_name: { type: string }
        serial: { type: string }
        fingerprint_sha256: { type: string }
        not_after: { type: [string, 'null'], format: date-time }
        state: { type: string, enum: [installed, unchanged, failed, hook_failed, unsupported, expired, cancelled, superseded, pending, delivered, fetched] }
        reason: { type: string, description: 'reason code only' }
        hook_exit_code: { type: [integer, 'null'] }
        last_delivered_at: { type: [string, 'null'], format: date-time }
        revoked: { type: boolean }
        revoked_at: { type: [string, 'null'], format: date-time }
        active_item:
          oneOf:
            - $ref: '#/components/schemas/CertificateDeliveryItem'
            - type: 'null'
    HostCertificatePage:
      type: object
      additionalProperties: false
      description: 'a list contract page of a host''s certificates (name order by default)'
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HostCertificate' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        sort: { type: string, enum: [name, state, not_after, last_delivered_at] }
        order: { type: string, enum: [asc, desc] }
    AgentReleaseList:
      type: object
      properties:
        current_version: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/AgentReleaseInfo' } }
paths:
  /api/inventory/v1/hosts:
    get:
      operationId: listHosts
      x-freya-permission: 'inventory:read'
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: sort, in: query, description: 'default hostname (asc)', schema: { type: string, enum: [hostname, os_name, manufacturer, status, last_seen, created_at] } }
        - { $ref: '#/components/parameters/order' }
        - { name: hostname, in: query, description: 'substring, case-insensitive', schema: { type: string, maxLength: 255 } }
        - { name: os_name, in: query, description: 'exact OS name', schema: { type: string, maxLength: 255 } }
        - { name: manufacturer, in: query, schema: { type: string, maxLength: 255 } }
        - { name: status, in: query, schema: { type: string, enum: [active, stale, retired] } }
        - { name: tag, in: query, description: 'key or key=value', schema: { type: string, maxLength: 512 } }
        - { name: last_seen_from, in: query, description: 'hosts seen at or after this instant', schema: { type: string, format: date-time } }
        - { name: last_seen_to, in: query, description: 'hosts seen at or before this instant', schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200': { description: 'page of hosts (hostname order by default)', content: { application/json: { schema: { $ref: '#/components/schemas/HostPage' } } } }
        '422': { description: 'validation_failed (detail.param names the parameter)' }
  /api/inventory/v1/hosts/{id}:
    get: { operationId: getHost, x-freya-permission: 'inventory:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: host }, '404': { description: not_found } } }
    delete: { operationId: deleteHost, x-freya-permission: 'hosts:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/inventory/v1/hosts/{id}/latest:
    get: { operationId: getHostLatestSnapshot, x-freya-permission: 'inventory:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: snapshot }, '404': { description: not_found } } }
  /api/inventory/v1/hosts/{id}/tags:
    post: { operationId: setHostTags, x-freya-permission: 'hosts:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: tagged } } }
  /api/inventory/v1/hosts/{id}/retire:
    post: { operationId: retireHost, x-freya-permission: 'hosts:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: retired } } }
  /api/inventory/v1/hosts/{id}/snapshots:
    get:
      operationId: listHostSnapshots
      x-freya-permission: 'snapshots:read'
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: sort, in: query, description: 'default collected_at (desc)', schema: { type: string, enum: [collected_at] } }
        - { $ref: '#/components/parameters/order' }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200': { description: 'page of snapshot summaries (newest first by default)', content: { application/json: { schema: { $ref: '#/components/schemas/SnapshotPage' } } } }
        '422': { description: 'validation_failed (detail.param names the parameter)' }
  /api/inventory/v1/hosts/{id}/changes:
    get:
      operationId: listHostChanges
      x-freya-permission: 'snapshots:read'
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: sort, in: query, description: 'default detected_at (desc); kind is the change type', schema: { type: string, enum: [detected_at, kind] } }
        - { $ref: '#/components/parameters/order' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200': { description: 'page of detected changes (newest first by default)', content: { application/json: { schema: { $ref: '#/components/schemas/ChangePage' } } } }
        '422': { description: 'validation_failed (detail.param names the parameter)' }
  /api/inventory/v1/hosts/{id}/certificates:
    get:
      operationId: listHostCertificates
      summary: The host's current certificates, one row per name (feature 033); no material
      x-freya-permission: 'inventory:read'
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: sort, in: query, description: 'default name (asc)', schema: { type: string, enum: [name, state, not_after, last_delivered_at] } }
        - { $ref: '#/components/parameters/order' }
        - { name: state, in: query, schema: { type: string, enum: [installed, unchanged, failed, hook_failed, unsupported, expired, cancelled, superseded, pending, delivered, fetched] } }
        - { name: revoked, in: query, description: 'only revoked (true) or only not revoked (false) certificates', schema: { type: boolean } }
      responses:
        '200': { description: 'page of host certificates', content: { application/json: { schema: { $ref: '#/components/schemas/HostCertificatePage' } } } }
        '404': { description: not_found }
        '422': { description: 'validation_failed (detail.param names the parameter)' }
  /api/inventory/v1/certificate-deliveries:
    get:
      operationId: listCertificateDeliveries
      summary: Certificate delivery items, paged (feature 033); reads work while delivery is disabled
      x-freya-permission: 'inventory:read'
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: sort, in: query, description: 'default created_at (desc)', schema: { type: string, enum: [created_at, updated_at, state, name] } }
        - { $ref: '#/components/parameters/order' }
        - { name: host_id, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string, enum: [pending, delivered, fetched, installed, unchanged, failed, hook_failed, unsupported, superseded, expired, cancelled] } }
        - { name: name, in: query, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' } }
        - { name: certificate_id, in: query, schema: { type: string, maxLength: 128 } }
        - { name: delivery_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'page of delivery items', content: { application/json: { schema: { $ref: '#/components/schemas/CertificateDeliveryItemPage' } } } }
        '422': { description: 'validation_failed (detail.param names the parameter)' }
  /api/inventory/v1/certificate-deliveries/{item_id}:
    get:
      operationId: getCertificateDelivery
      summary: One delivery item with its delivery (configuration, trigger, requested by)
      x-freya-permission: 'inventory:read'
      parameters: [{ $ref: '#/components/parameters/itemId' }]
      responses:
        '200': { description: 'item with its delivery', content: { application/json: { schema: { $ref: '#/components/schemas/CertificateDeliveryItemDetail' } } } }
        '404': { description: not_found }
  /api/inventory/v1/certificate-deliveries/{item_id}/cancel:
    post:
      operationId: cancelCertificateDelivery
      summary: Cancel a queued delivery item (cancelled_by_user)
      x-freya-permission: 'agents:manage'
      x-freya-max-body-bytes: 1024
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/itemId' }]
      responses:
        '200': { description: cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/CertificateDeliveryItem' } } } }
        '404': { description: not_found }
        '409': { description: not_cancellable }
        '503': { description: certificate_delivery_disabled }
  /api/inventory/v1/snapshots/{id}:
    get: { operationId: getSnapshot, x-freya-permission: 'snapshots:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: snapshot }, '404': { description: not_found } } }
    delete: { operationId: deleteSnapshot, x-freya-permission: 'snapshots:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/inventory/v1/snapshots/{id}/diff/{other}:
    get: { operationId: diffSnapshots, x-freya-permission: 'snapshots:read', parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/other' }], responses: { '200': { description: diff } } }
  /api/inventory/v1/agents:
    get:
      operationId: listAgents
      summary: Every enrolled agent (online and offline) with its version and upgrade state
      x-freya-permission: 'agents:manage'
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: sort, in: query, description: 'default hostname (asc); state is the upgrade state', schema: { type: string, enum: [hostname, version, state, last_seen] } }
        - { $ref: '#/components/parameters/order' }
        - { $ref: '#/components/parameters/upgradeState' }
        - { $ref: '#/components/parameters/outdated' }
        - { name: online, in: query, description: 'only connected (true) or disconnected (false) agents', schema: { type: boolean } }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200': { description: 'agent fleet page', content: { application/json: { schema: { $ref: '#/components/schemas/AgentFleet' } } } }
        '422': { description: 'validation_failed (detail.param names the parameter)' }
  /api/inventory/v1/agents/upgrades:
    get:
      operationId: listAgentUpgrades
      x-freya-permission: 'agents:manage'
      parameters: [{ $ref: '#/components/parameters/requestState' }, { $ref: '#/components/parameters/agentIdQuery' }, { $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }]
      responses: { '200': { description: 'upgrade requests, newest first', content: { application/json: { schema: { $ref: '#/components/schemas/AgentUpgradeList' } } } } }
    post:
      operationId: requestAgentUpgrades
      summary: Upgrade one agent, a selection or every outdated agent to the tenant target version
      x-freya-permission: 'agents:manage'
      x-freya-max-body-bytes: 65536
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradeRequest' } } } }
      responses:
        '202': { description: 'requests created (delivered to online agents)', content: { application/json: { schema: { $ref: '#/components/schemas/UpgradeBatchResult' } } } }
        '400': { description: invalid_argument }
        '409': { description: no_release_available }
        '413': { description: body_too_large }
  /api/inventory/v1/agents/upgrades/{id}/cancel:
    post:
      operationId: cancelAgentUpgrade
      x-freya-permission: 'agents:manage'
      x-freya-max-body-bytes: 1024
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/AgentUpgrade' } } } }
        '404': { description: not_found }
        '409': { description: not_cancellable }
  /api/inventory/v1/agents/upgrade-policy:
    get:
      operationId: getAgentUpgradePolicy
      summary: The tenant's automatic agent upgrade policy (defaults when none is stored)
      x-freya-permission: 'agents:manage'
      responses: { '200': { description: policy, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradePolicy' } } } } }
    put:
      operationId: updateAgentUpgradePolicy
      summary: Configure automatic agent upgrades and the target agent version
      x-freya-permission: 'agentupgrades:manage'
      x-freya-max-body-bytes: 4096
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradePolicy' } } } }
      responses:
        '200': { description: stored, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradePolicy' } } } }
        '400': { description: invalid_argument }
        '409': { description: unknown_version }
        '413': { description: body_too_large }
  /api/inventory/v1/agents/upgrade-policy/resume:
    post:
      operationId: resumeAgentUpgradePolicy
      summary: Resume automatic upgrades paused by a failed automatic upgrade
      x-freya-permission: 'agentupgrades:manage'
      x-freya-max-body-bytes: 1024
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      responses: { '200': { description: resumed, content: { application/json: { schema: { $ref: '#/components/schemas/UpgradePolicy' } } } } }
  /api/inventory/v1/agents/auto-enroll:
    get:
      operationId: getAutoEnroll
      summary: The tenant's automatic enrollment switch and keys (secrets are never returned)
      x-freya-permission: 'agents:manage'
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { name: sort, in: query, description: 'key order; default name (asc)', schema: { type: string, enum: [name, created_at] } }
        - { $ref: '#/components/parameters/order' }
      responses:
        '200': { description: settings and one page of keys, content: { application/json: { schema: { $ref: '#/components/schemas/AutoEnroll' } } } }
        '422': { description: 'validation_failed (detail.param names the parameter)' }
    put:
      operationId: setAutoEnroll
      summary: Turn automatic enrollment on or off for the tenant
      x-freya-permission: 'agents:manage'
      x-freya-max-body-bytes: 1024
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoEnrollSwitch' } } } }
      responses:
        '200': { description: stored }
        '422': { description: validation_failed }
  /api/inventory/v1/agents/auto-enroll/keys:
    post:
      operationId: createAutoEnrollKey
      summary: Create an auto-enrollment key (the secret is returned once)
      x-freya-permission: 'agents:manage'
      x-freya-max-body-bytes: 16384
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoEnrollKeyCreate' } } } }
      responses:
        '201': { description: 'created: {key, secret}', content: { application/json: { schema: { $ref: '#/components/schemas/AutoEnrollKeySecret' } } } }
        '409': { description: conflict }
        '422': { description: validation_failed }
  /api/inventory/v1/agents/auto-enroll/keys/{id}:
    patch:
      operationId: updateAutoEnrollKey
      summary: Change an auto-enrollment key (name, networks, on/off, expiry, limit)
      x-freya-permission: 'agents:manage'
      x-freya-max-body-bytes: 16384
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoEnrollKeyUpdate' } } } }
      responses:
        '200': { description: updated, content: { application/json: { schema: { $ref: '#/components/schemas/AutoEnrollKey' } } } }
        '404': { description: not_found }
        '409': { description: conflict }
        '422': { description: validation_failed }
    delete:
      operationId: deleteAutoEnrollKey
      summary: Delete an auto-enrollment key (enrolled agents keep working)
      x-freya-permission: 'agents:manage'
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: deleted }
        '404': { description: not_found }
  /api/inventory/v1/agents/auto-enroll/keys/{id}/rotate:
    post:
      operationId: rotateAutoEnrollKey
      summary: Replace the key's secret (returned once); the key id stays
      x-freya-permission: 'agents:manage'
      x-freya-max-body-bytes: 1024
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: 'rotated: {key, secret}', content: { application/json: { schema: { $ref: '#/components/schemas/AutoEnrollKeySecret' } } } }
        '404': { description: not_found }
  /api/inventory/v1/agent-releases:
    get:
      operationId: listAgentReleases
      summary: Signed agent releases stored on the platform
      x-freya-permission: 'agents:manage'
      responses: { '200': { description: 'agent releases, newest first', content: { application/json: { schema: { $ref: '#/components/schemas/AgentReleaseList' } } } } }
  /api/inventory/v1/agents/{id}:
    get:
      operationId: getAgent
      x-freya-permission: 'agents:manage'
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: 'agent with recent upgrades', content: { application/json: { schema: { $ref: '#/components/schemas/AgentDetail' } } } }
        '404': { description: not_found }
  /api/inventory/v1/agents/enroll-token:
    post: { operationId: mintEnrollmentToken, x-freya-permission: 'agents:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: 'token minted (secret returned once)' } } }
  /api/inventory/v1/agents/{host_id}/refresh:
    post: { operationId: refreshInventory, x-freya-permission: 'agents:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/hostId' }], responses: { '200': { description: 'refresh requested' } } }
  /api/inventory/v1/agents/{id}/revoke:
    post: { operationId: revokeAgent, x-freya-permission: 'agents:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: revoked } } }
  /api/inventory/v1/statistics/tenant:
    get: { operationId: getTenantStatistics, x-freya-permission: 'stats:read', responses: { '200': { description: 'tenant statistics' } } }
  /api/inventory/v1/statistics/system:
    get: { operationId: getSystemStatistics, x-freya-permission: 'stats:read', responses: { '200': { description: 'system statistics (admin)' } } }
  /api/inventory/v1/backup/export:
    post: { operationId: exportBackup, x-freya-permission: 'backup:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: export } } }
  /api/inventory/v1/backup/import:
    post: { operationId: importBackup, x-freya-permission: 'backup:manage', x-freya-max-body-bytes: 268435456, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: imported } } }
  /api/inventory/v1/stream:
    get: { operationId: streamEvents, x-freya-permission: 'inventory:read', responses: { '200': { description: 'SSE event stream (agent-online/offline, snapshot-received)' } } }
