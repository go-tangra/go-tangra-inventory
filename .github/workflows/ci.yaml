# go-tangra-inventory CI (go-tangra v4). Generated from go-freya tools/split/templates/ci.yaml.tmpl.
#
# Images: ghcr.io/go-tangra/go-tangra-inventory tagged <version>, <major>.<minor>, <major> (from tags vX.Y.Z)
# and sha-<short> (default-branch pushes and tags). There is deliberately NO `latest`,
# NO branch tag and NO registry cleanup job: the v3.x images published by the old
# workflow must stay available.
#
# SDK releases: the nested sdk/ module is released by hand with a `sdk/vX.Y.Z` tag.
# The tag filter 'v*' is a glob anchored at the start of the tag name (`*` does not
# cross `/`), so `sdk/v4.0.0` never matches it and never builds or pushes an image.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/go-tangra/go-tangra-inventory

jobs:
  go:
    name: Go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go.sum

      - name: go vet (service)
        run: go vet ./...

      - name: go test -race (service)
        run: go test -race ./...

      - name: go vet (sdk)
        working-directory: sdk
        run: go vet ./...

      - name: go test -race (sdk)
        working-directory: sdk
        run: go test -race ./...

  ui:
    name: UI lint + unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@go-tangra'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

  buf:
    name: Buf lint + breaking (sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking compares against the sdk/v4.0.0 tag

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: buf lint
        working-directory: sdk
        run: buf lint

      - name: buf breaking (against sdk/v4.0.0)
        working-directory: sdk
        run: buf breaking --against '../.git#tag=sdk/v4.0.0,subdir=sdk'

  # The endpoint agent is not part of the image: operators build it for the hosts
  # they manage (make agent). CI only proves it still cross-compiles; it uploads
  # nothing and publishes no release.
  agent:
    name: Agent cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go.sum

      - name: go build inventory-agent (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o "${RUNNER_TEMP}/inventory-agent" ./cmd/inventory-agent

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - go
      - ui
      - buf
      - agent
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build (push on tags and main pushes only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
