# go-tangra-inventory CI (go-tangra v4). Generated from go-freya tools/split/templates/ci.yaml.tmpl.
#
# Images: ghcr.io/go-tangra/go-tangra-inventory tagged <version>, <major>.<minor>, <major> (from tags vX.Y.Z)
# and sha-<short> (default-branch pushes and tags). There is deliberately NO `latest`,
# NO branch tag and NO registry cleanup job: the v3.x images published by the old
# workflow must stay available.
#
# SDK releases: the nested sdk/ module is released by hand with a `sdk/vX.Y.Z` tag.
# The tag filter 'v*' is a glob anchored at the start of the tag name (`*` does not
# cross `/`), so `sdk/v4.0.0` never matches it and never builds or pushes an image.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: 'off'
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/go-tangra/go-tangra-inventory
  # Release signing PUBLIC keyring ("<id>:<base64 Ed25519 public key>[,...]",
  # feature 023), compiled into the agents and the service. Public data kept
  # as a repository variable; see README "Agent release signing".
  AGENT_RELEASE_KEYS: ${{ vars.AGENT_RELEASE_PUBLIC_KEYS }}

jobs:
  go:
    name: Go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go.sum

      - name: go vet (service)
        run: go vet ./...

      - name: go test -race (service)
        run: go test -race ./...

      - name: go vet (sdk)
        working-directory: sdk
        run: go vet ./...

      - name: go test -race (sdk)
        working-directory: sdk
        run: go test -race ./...

  ui:
    name: UI lint + unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@go-tangra'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

  buf:
    name: Buf lint + breaking (sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking compares against the sdk/v4.3.0 tag

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: buf lint
        working-directory: sdk
        run: buf lint

      - name: buf breaking (against sdk/v4.3.0)
        working-directory: sdk
        run: buf breaking --against '../.git#tag=sdk/v4.3.0,subdir=sdk'

  # CI proves the endpoint agent cross-compiles for every platform; job
  # `packages` builds the eight release artifacts, `sign` signs them for a v*
  # tag, `docker` bundles the signed release into the image (the service
  # offers it to agents for self-upgrade) and `release` attaches it to the
  # GitHub release.
  agent:
    name: Agent cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go.sum

      - name: go build inventory-agent (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o "${RUNNER_TEMP}/inventory-agent" ./cmd/inventory-agent

  # The eight agent release artifacts (feature 023): .deb and .rpm of the
  # Linux agent (binary, systemd unit, sample /etc/inventory-agent/agent.yaml)
  # for amd64 and arm64 built with nfpm (packaging/nfpm.yaml), the raw Linux
  # binaries and the Windows exes, all version-stamped and carrying the
  # release signing keyring. Tags build their version; other builds
  # `git describe` (e.g. 4.2.0-11-gabc1234). The amd64 .deb is installed and
  # purged on the runner as a smoke test. Signing happens in job `sign`.
  packages:
    name: Agent release artifacts
    runs-on: ubuntu-latest
    needs:
      - go
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go.sum

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(git describe --tags --match 'v*' --always | sed 's/^v//')"; fi
          echo "AGENT_VERSION=${v}" >> "${GITHUB_ENV}"

      - name: Build the eight agent artifacts
        run: make agent-release AGENT_VERSION="${AGENT_VERSION}" AGENT_RELEASE_KEYS="${AGENT_RELEASE_KEYS}"

      - name: Inspect packages
        run: |
          sudo apt-get install -y --no-install-recommends rpm >/dev/null
          ls -l dist/agent
          for f in dist/agent/*.deb; do dpkg-deb --info "$f" | sed -n '/Package:/,/Architecture:/p'; dpkg-deb -c "$f"; done
          for f in dist/agent/*.rpm; do rpm -qpi "$f" | grep -E '^(Name|Version|Architecture)'; rpm -qpl "$f"; done

      - name: Install smoke test (amd64 .deb)
        run: |
          sudo dpkg -i dist/agent/*_amd64.deb
          test -x /usr/bin/inventory-agent
          test "$(sudo stat -c %a /var/lib/inventory-agent)" = 700
          test "$(systemctl is-enabled inventory-agent.service)" = enabled
          # Not started: no enrollment token or credential yet (ConditionPathExists).
          if systemctl is-active --quiet inventory-agent.service; then echo "started without a token" >&2; exit 1; fi
          sudo dpkg --purge tangra-inventory-agent
          test ! -e /usr/bin/inventory-agent
          test ! -e /var/lib/inventory-agent

      - uses: actions/upload-artifact@v4
        with:
          name: agent-artifacts
          path: dist/agent/*
          if-no-files-found: error

  # Signs the agent release of a v* tag (feature 023): writes the Ed25519-
  # signed manifest agent-release.json(.sig) over the eight artifacts,
  # verifies it with the compiled keyring and checks the binaries carry the
  # production keyring and no development key. The private key exists ONLY
  # as the secret AGENT_RELEASE_SIGNING_KEY of the protected GitHub
  # environment `release` (required reviewers); the job fails with an
  # explicit message when it or the public keyring is missing. Other builds
  # skip it (no signature, no bundle in the image).
  sign:
    name: Sign the agent release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    needs:
      - packages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: agent-artifacts
          path: dist/agent

      - name: Require the signing configuration
        env:
          AGENT_RELEASE_SIGNING_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${AGENT_RELEASE_SIGNING_KEY}" ]; then
            echo "::error::secret AGENT_RELEASE_SIGNING_KEY is not set in the GitHub environment 'release' (see README: Agent release signing)"; exit 1
          fi
          if [ -z "${AGENT_RELEASE_KEYS}" ]; then
            echo "::error::repository variable AGENT_RELEASE_PUBLIC_KEYS is not set (see README: Agent release signing)"; exit 1
          fi

      - name: Sign and verify
        env:
          AGENT_RELEASE_SIGNING_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          keyid="${AGENT_RELEASE_KEYS%%:*}"
          go build -trimpath -ldflags "-X github.com/go-tangra/go-tangra-inventory/v4/internal/agentrelease.productionKeys=${AGENT_RELEASE_KEYS}" -o "${RUNNER_TEMP}/agent-release" ./cmd/agent-release
          "${RUNNER_TEMP}/agent-release" sign -key-env AGENT_RELEASE_SIGNING_KEY -key-id "${keyid}" -version "${v}" -dir dist/agent
          unset AGENT_RELEASE_SIGNING_KEY
          "${RUNNER_TEMP}/agent-release" verify -dir dist/agent -version "${v}"
          make release-check AGENT_VERSION="${v}" AGENT_RELEASE_KEYS="${AGENT_RELEASE_KEYS}"

      - name: SBOM of the agent artifacts
        uses: anchore/sbom-action@v0
        with:
          path: dist/agent
          format: spdx-json
          output-file: dist/agent/inventory-agent.sbom.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: agent-release
          path: dist/agent/*
          if-no-files-found: error

  # A v* tag attaches the signed agent release (eight artifacts, manifest,
  # signature, SBOM) and SHA256SUMS to the tag's GitHub release (created when
  # missing). `inventorysvc agent-release import` accepts the same files.
  release:
    name: Agent release on the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - sign
      - docker
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-release
          path: dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes "Inventory ${GITHUB_REF_NAME}. Signed agent release: tangra-inventory-agent .deb/.rpm and binaries for Linux amd64/arm64, Windows exes, agent-release.json + .sig; see deploy/README.md (Installing the agent)."
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  # Package upgrade and rollback of the agent in Debian 12 and Rocky 9
  # containers with systemd (feature 023, tests/e2e): install N, upgrade to a
  # test-signed N+1, roll back a broken N+1, refuse a tampered artifact.
  e2e-upgrade:
    name: Agent upgrade e2e (systemd containers)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - go
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sdk/go.sum

      - name: make e2e-upgrade
        run: make e2e-upgrade

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - go
      - ui
      - buf
      - agent
      - sign
    # sign runs on tags only; other builds go on without a bundle.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the signed agent release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: agent-release
          path: agent-releases/${{ github.ref_name }}

      - name: Name the bundle after the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mv "agent-releases/${GITHUB_REF_NAME}" "agent-releases/${GITHUB_REF_NAME#v}"
          rm -f agent-releases/*/*.sbom.spdx.json
          ls -l agent-releases/*

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build (push on tags and main pushes only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            AGENT_RELEASE_KEYS=${{ env.AGENT_RELEASE_KEYS }}
