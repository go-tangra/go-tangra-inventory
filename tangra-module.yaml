# How inventory describes itself to the gateway's module catalogue (spec 035).
# Each v* release publishes catalogue-entry.json and bundle.zip built from
# this file and deploy/bundle/ (see .github/workflows/ci.yaml, job catalogue).
schema: 1
module: inventory
display_name: Inventory
category: Infrastructure
summary: IT asset inventory - endpoint agents report hardware, software and network snapshots with change history, statistics and backup.
image: ghcr.io/go-tangra/go-tangra-inventory
routes:
  prefixes: [/api/inventory, /m/inventory, /inventory]
  names: [inventory]
min_core: { gateway: 4.9.0, auth: 4.10.0 }
bundle:
  dir: deploy/bundle
  templates: [config.yaml, policy.yaml]
  tls_hosts: [inventory-db, inventory-valkey, inventory-ingest]
host_inputs:
  - key: MODULE_ADVERTISE_HOST
    label: Host name the core uses to reach this module
    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
  - key: MODULE_BIND_IP
    label: IP address the module's mesh ports listen on (reachable from the core)
    pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'
  - key: INGEST_PUBLIC_PORT
    label: Host port of the agent ingest edge (reached directly by inventory agents)
    pattern: '^[1-9][0-9]{1,4}$'
    default: "9977"
docs: https://github.com/go-tangra/go-tangra-inventory#readme
